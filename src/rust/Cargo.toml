[package]
name = "stock-chart"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "stock-chart"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "line_series", "candlestick", "chrono", "ttf", "fontconfig-dlopen"] }
anyhow = "1"
